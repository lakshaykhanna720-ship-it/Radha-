<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing sound rings -->
  <circle cx="256" cy="256" r="210" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" fill="none"/>
  <circle cx="256" cy="256" r="175" stroke="#10b981" stroke-width="8" stroke-opacity="0.4" fill="none"/>
  
  <!-- Central Soundbox / Cab emblem -->
  <circle cx="256" cy="256" r="135" fill="#047857" stroke="#34d399" stroke-width="8"/>
  
  <!-- Cab silhouette -->
  <path d="M190 280 L205 225 C210 210 225 200 242 200 L270 200 C287 200 302 210 307 225 L322 280 C330 282 336 290 336 300 L336 330 C336 338 330 344 322 344 L312 344 C304 344 298 338 298 330 L298 320 L214 320 L214 330 C214 338 208 344 200 344 L190 344 C182 344 176 338 176 330 L176 300 C176 290 182 282 190 280 Z" fill="#ffffff"/>
  <!-- Cab Windows -->
  <path d="M214 270 L223 230 C225 222 232 216 240 216 L272 216 C280 216 287 222 289 230 L298 270 Z" fill="#064e3b"/>
  <!-- Taxi Light Bar on roof -->
  <rect x="236" y="186" width="40" height="12" rx="4" fill="#fbbf24"/>

  <!-- Speaker audio waves radiating -->
  <path d="M375 225 C395 242 395 270 375 287" stroke="#34d399" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M405 205 C435 235 435 277 405 307" stroke="#6ee7b7" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Rupee Symbol badge -->
  <circle cx="340" cy="170" r="38" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <text x="340" y="186" font-size="44" font-family="Arial, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
</svg>
